name: Set up Arch build container
description: Install the build toolchain and create the unprivileged builder user.

runs:
  using: composite
  steps:
    - name: Install toolchain
      shell: bash
      run: pacman -S --noconfirm --needed base-devel pacman-contrib namcap sudo github-cli jq

    - name: Prepare build user
      shell: bash
      run: |
        useradd -m builder
        chown -R builder:builder "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
