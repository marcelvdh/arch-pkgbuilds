name: Check

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['packages/*/PKGBUILD', '**.md']   # a PKGBUILD change is release.yml's job; it builds too
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.l.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: l
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD)"
            if grep -qv '^packages/' <<<"$changed"; then
              list="$(bash scripts/list-packages.sh)"   # shared infra changed: build all
            else
              list="$(cut -d/ -f2 <<<"$changed" | sort -u \
                | while read -r p; do test -d "packages/$p" && echo "$p"; done \
                | jq -Rnc '[inputs]')"
            fi
          else
            list="$(bash scripts/list-packages.sh)"
          fi
          echo "packages=$list" >> "$GITHUB_OUTPUT"

  policy:
    if: github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash <(git show "origin/$GITHUB_BASE_REF:scripts/check-bump.sh") "origin/$GITHUB_BASE_REF"

  build:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - name: Install git                # checkout and the setup action need it
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-arch

      - name: Verify upstream checksums
        working-directory: packages/${{ matrix.package }}
        run: sudo -H -u builder bash "$GITHUB_WORKSPACE/scripts/verify.sh"

      - name: Build and lint
        working-directory: packages/${{ matrix.package }}
        run: sudo -H -u builder bash "$GITHUB_WORKSPACE/scripts/build.sh"

  result:                                  # the one check the main ruleset requires
    needs: [discover, policy, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
