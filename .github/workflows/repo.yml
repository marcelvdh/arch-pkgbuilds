name: Publish repo

# The "repo" release is what pacman.conf points at; rebuilt from scratch each time.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# Each run rebuilds from every release, so a waiting run that a newer one
# replaces loses nothing. Never cancel one mid-upload, though.
concurrency:
  group: pacman-repo
  cancel-in-progress: false

jobs:
  repo:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash          # container steps otherwise default to `sh -e {0}`
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli

      - uses: actions/checkout@v4
        with:
          ref: main          # latest main when the job starts, not when it was queued

      - name: Download releases
        id: download
        run: |
          source scripts/lib.sh
          mkdir repo
          for path in packages/*/; do
            pkg="$(basename "$path")"
            ver="$(pkgbuild pkgver "$path/PKGBUILD")"
            # Still building, or failed (its Release run shows that). Publishing
            # now would drop it from the database; its release triggers a rebuild.
            if ! gh release view "$pkg/v$ver" >/dev/null 2>&1; then
              echo "::notice::$pkg/v$ver has no release yet; leaving the database as it is"
              exit 0
            fi
            gh release download "$pkg/v$ver" --pattern '*.pkg.tar.zst' --dir repo
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build repo database
        if: steps.download.outputs.ready
        env:
          signing_key: ${{ secrets.SIGNING_KEY }}
        run: |
          gpg --batch --import <<<"$signing_key"
          cd repo
          for f in *.pkg.tar.zst; do
            gpg --batch --yes --detach-sign "$f"
          done
          repo-add --sign arch-pkgbuilds.db.tar.gz ./*.pkg.tar.zst
          # repo-add leaves .db/.files (and their .sig) as symlinks to the .tar.gz
          # files; releases can't hold symlinks, so replace each with a real copy.
          for link in arch-pkgbuilds.db arch-pkgbuilds.db.sig arch-pkgbuilds.files arch-pkgbuilds.files.sig; do
            cp --remove-destination "$(readlink -f "$link")" "$link"
          done

      - name: Publish to rolling release
        if: steps.download.outputs.ready
        timeout-minutes: 75
        run: |
          gh release view repo >/dev/null 2>&1 \
            || gh release create repo --latest=false \
                 --title "Pacman repository" \
                 --notes "Rolling release backing the pacman repository — see the README."
          published="$(gh api "repos/$GH_REPO/releases/tags/repo" --jq '.assets[] | "\(.name) \(.digest)"')"
          # Upload only what the release does not already hold, matched on content.
          stale=()
          for f in repo/*.pkg.tar.zst; do
            grep -qxF "$(basename "$f") sha256:$(sha256sum "$f" | cut -d' ' -f1)" <<<"$published" || stale+=("$f")
          done
          bash scripts/gh-upload.sh repo "${stale[@]}"
          bash scripts/gh-upload.sh repo repo/*.pkg.tar.zst.sig repo/arch-pkgbuilds.*
          for name in $(gh release view repo --json assets --jq '.assets[].name'); do
            [ -e "repo/$name" ] || gh release delete-asset repo "$name" -y
          done
