name: Nightly update

on:
  schedule:
    - cron: '0 23 * * *'                # 23:00 UTC (23:00 GMT / 00:00 BST in London)
  workflow_dispatch:

permissions:
  contents: read       # the app token opens the PR

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.l.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "packages=$(bash scripts/list-packages.sh)" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    concurrency:
      group: update-${{ matrix.package }}
    env:
      GH_TOKEN: ${{ github.token }}
      pkg: ${{ matrix.package }}
    steps:
      - name: Install git                # checkout and the setup action need it
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-arch

      - name: Bump PKGBUILD
        id: up
        working-directory: packages/${{ matrix.package }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib.sh"
          [ -f "$GITHUB_WORKSPACE/updaters/$pkg.sh" ] || { echo "No updater; nothing to check."; exit 0; }
          old="$(pkgbuild pkgver)"
          new="$(sudo -H -u builder bash "$GITHUB_WORKSPACE/updaters/$pkg.sh")"
          echo "$pkg: $old -> $new"
          git diff --quiet PKGBUILD && { echo "Already up to date."; exit 0; }
          sudo -H -u builder updpkgsums
          sudo -H -u builder bash "$GITHUB_WORKSPACE/scripts/verify.sh"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      # PRs from github-actions[bot] need approving by hand before their checks run,
      # and github.token cannot enable auto-merge.
      - name: Mint app token
        id: token
        if: steps.up.outputs.new != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.UPDATER_APP_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request
        if: steps.up.outputs.new != ''
        env:
          new: ${{ steps.up.outputs.new }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          branch="autoupdate/$pkg"
          title="Update $pkg to $new"
          if gh pr list --head "$branch" --state open --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "An open PR for $title already exists; skipping."
            exit 0
          fi
          # Commit through the API instead of git push so GitHub signs it.
          api="repos/$GITHUB_REPOSITORY/git"
          blob="$(gh api "$api/blobs" -f encoding=base64 \
            -f content="$(base64 -w0 "packages/$pkg/PKGBUILD")" --jq .sha)"
          tree="$(gh api "$api/trees" -f base_tree="$GITHUB_SHA" \
            -f "tree[][path]=packages/$pkg/PKGBUILD" -f 'tree[][mode]=100644' \
            -f 'tree[][type]=blob' -f "tree[][sha]=$blob" --jq .sha)"
          commit="$(gh api "$api/commits" -f message="$title" -f tree="$tree" \
            -f "parents[]=$GITHUB_SHA" --jq .sha)"
          # One branch per package: a newer version replaces the one still waiting.
          # Move it in one step; a branch briefly equal to main would close its PR.
          gh api "$api/refs" -f ref="refs/heads/$branch" -f sha="$commit" \
            || gh api -X PATCH "$api/refs/heads/$branch" -f sha="$commit" -F force=true
          if gh pr list --head "$branch" --state open | grep -q .; then
            gh pr edit "$branch" --title "$title" --body "$title."
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$title."
          fi
          # Merges once check.yml's `result` passes; merges at once if it already has.
          gh pr merge "$branch" --auto --merge

