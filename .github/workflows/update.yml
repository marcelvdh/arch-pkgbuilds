name: Nightly update

on:
  schedule:
    - cron: '0 23 * * *'                # 23:00 UTC (23:00 GMT / 00:00 BST in London)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build but do not open a PR
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.l.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "packages=$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rsc 'split("\n")|map(select(length>0))')" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    concurrency:
      group: update-${{ matrix.package }}
    env:
      GH_TOKEN: ${{ github.token }}
      pkg: ${{ matrix.package }}
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed base-devel pacman-contrib namcap git sudo github-cli w3m

      - uses: actions/checkout@v4

      - name: Prepare build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Update and build
        id: up
        run: |
          if [ ! -f "updaters/$pkg.sh" ]; then
            echo "No updater; nothing to check."
            exit 0
          fi
          old="$(grep -oP '^pkgver=\K.*' "packages/$pkg/PKGBUILD")"
          new="$(sudo -H -u builder bash -c "cd 'packages/$pkg' && bash '$GITHUB_WORKSPACE/updaters/$pkg.sh'")"
          echo "$pkg: $old -> $new"
          if git diff --quiet -- "packages/$pkg/PKGBUILD"; then
            echo "Already up to date."
            exit 0
          fi
          sudo -H -u builder bash -c "cd 'packages/$pkg' && updpkgsums && bash '$GITHUB_WORKSPACE/scripts/build.sh'"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.up.outputs.new != '' && github.event.inputs.dry_run != 'true'
        run: |
          new="${{ steps.up.outputs.new }}"
          branch="autoupdate/$pkg-$new"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "An open PR for $branch already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "packages/$pkg/PKGBUILD"
          git commit -m "Update $pkg to $new"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -fu origin "$branch"
          gh pr create --base main --head "$branch" --title "Update $pkg to $new" --body "Update $pkg to $new."

      - name: Upload built package
        if: steps.up.outputs.new != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ steps.up.outputs.new }}
          path: ${{ github.workspace }}/packages/${{ matrix.package }}/*.pkg.tar.zst
          if-no-files-found: error

      - name: Report failure
        if: failure()
        run: |
          title="Update failed: $pkg on $(date -u +%Y-%m-%d)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue list --state open --search "$title in:title" | grep -q . \
            || gh issue create --title "$title" --body "$run_url"
