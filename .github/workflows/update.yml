name: Nightly update

on:
  schedule:
    - cron: '0 23 * * *'                # 23:00 UTC (23:00 GMT / 00:00 BST in London)
  workflow_dispatch:

permissions:
  contents: read
  issues: write        # only for "Report failure"; the app token opens the PR

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.l.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "packages=$(bash scripts/list-packages.sh)" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    concurrency:
      group: update-${{ matrix.package }}
    env:
      GH_TOKEN: ${{ github.token }}
      pkg: ${{ matrix.package }}
    steps:
      - name: Install git                # checkout and the setup action need it
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-arch

      - name: Bump PKGBUILD
        id: up
        working-directory: packages/${{ matrix.package }}
        run: |
          [ -f "$GITHUB_WORKSPACE/updaters/$pkg.sh" ] || { echo "No updater; nothing to check."; exit 0; }
          old="$(grep -oP '^pkgver=\K.*' PKGBUILD)"
          new="$(sudo -H -u builder bash "$GITHUB_WORKSPACE/updaters/$pkg.sh")"
          echo "$pkg: $old -> $new"
          git diff --quiet PKGBUILD && { echo "Already up to date."; exit 0; }
          sudo -H -u builder updpkgsums                                  # the PR's Check run compiles it
          sudo -H -u builder bash "$GITHUB_WORKSPACE/scripts/verify.sh"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      # PRs from github-actions[bot] need approving by hand before their checks run.
      - name: Mint app token
        id: token
        if: steps.up.outputs.new != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.UPDATER_APP_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}

      - name: Open pull request
        if: steps.up.outputs.new != ''
        env:
          new: ${{ steps.up.outputs.new }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          branch="autoupdate/$pkg-$new"
          if gh pr list --head "$branch" --state open | grep -q .; then
            echo "An open PR for $branch already exists; skipping."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" \
            || gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" -f sha="$GITHUB_SHA" -F force=true
          # Commit through the API instead of git push so GitHub signs it
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/packages/$pkg/PKGBUILD" \
            -f branch="$branch" -f message="Update $pkg to $new" \
            -f sha="$(git rev-parse "HEAD:packages/$pkg/PKGBUILD")" \
            -f content="$(base64 -w0 "packages/$pkg/PKGBUILD")"
          gh pr create --base main --head "$branch" --title "Update $pkg to $new" --body "Update $pkg to $new."

      - name: Report failure
        if: failure()
        run: |
          title="Update failed: $pkg on $(date -u +%Y-%m-%d)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue list --state open --search "$title in:title" | grep -q . \
            || gh issue create --title "$title" --body "$run_url"
