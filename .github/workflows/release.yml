name: Release

on:
  push:
    tags:
      - '*/v*'                     # e.g. google-chrome/v151.0.7922.169
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Package to release ("all" for every package; blank for whatever is not released yet)
        type: string
        required: false

permissions:
  contents: read

# GitHub can fire two push events for one merge; concurrent runs race and 404.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false        # a second merge must not cancel the first one's release

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    env:
      GH_TOKEN: ${{ github.token }}
      pkg_input: ${{ github.event.inputs.package }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            list="$(jq -nc --arg p "${GITHUB_REF_NAME%%/*}" '[$p]')"   # claude-code/v2.1.252 -> claude-code
          elif [ "$pkg_input" = all ]; then
            list="$(bash scripts/list-packages.sh)"
          elif [ -n "$pkg_input" ]; then
            list="$(jq -nc --arg p "$pkg_input" '[$p]')"
          else
            list="$(bash scripts/unreleased.sh)"
          fi
          echo "packages=$list" >> "$GITHUB_OUTPUT"

  release:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    permissions:
      contents: write        # creates the tag ref and the release
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60      # a stalled upload must not hold a runner for 6h
    defaults:
      run:
        shell: bash          # container steps otherwise default to `sh -e {0}`
    env:
      GH_TOKEN: ${{ github.token }}
      pkg: ${{ matrix.package }}
    steps:
      - name: Install git                # checkout and the setup action need it
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-arch

      - name: Verify upstream checksums
        working-directory: packages/${{ matrix.package }}
        run: sudo -H -u builder bash "$GITHUB_WORKSPACE/scripts/verify.sh"

      - name: Build
        working-directory: packages/${{ matrix.package }}
        run: sudo -H -u builder bash "$GITHUB_WORKSPACE/scripts/build.sh"

      - name: Publish release
        timeout-minutes: 30
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$pkg/v$(grep -oPm1 '^pkgver=\K.*' "packages/$pkg/PKGBUILD")"
          fi
          notes="$pkg ${tag##*/v}"
          # Make the tag ourselves; letting `gh release create` do it can leave it untagged.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null 2>&1 || true
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$notes" 2>/dev/null \
            || gh release edit "$tag" --title "$tag" --notes "$notes"
          # Upload before pruning: deleting first leaves the release empty whenever
          # the upload stalls, and the repo job then refuses to build a database.
          bash scripts/gh-upload.sh "$tag" packages/$pkg/*.pkg.tar.zst
          for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
            # anything we did not just build is a stale pkgrel; drop it
            [ -e "packages/$pkg/$asset" ] || gh release delete-asset "$tag" "$asset" -y
          done

  # The "repo" release is what pacman.conf points at; rebuilt from scratch each time.
  repo:
    needs: [discover, release]
    permissions:
      contents: write        # uploads the packages and database
    if: ${{ !cancelled() && needs.discover.outputs.packages != '[]' }}   # nothing released, nothing to sync
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash          # container steps otherwise default to `sh -e {0}`
    concurrency:
      group: pacman-repo
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli

      - uses: actions/checkout@v4

      - name: Build repo database
        env:
          signing_key: ${{ secrets.SIGNING_KEY }}
        run: |
          gpg --batch --import <<<"$signing_key"
          mkdir repo
          for path in packages/*/; do
            pkg="$(basename "$path")"
            ver="$(grep -oPm1 '^pkgver=\K.*' "$path/PKGBUILD")"
            gh release download "$pkg/v$ver" --pattern '*.pkg.tar.zst' --dir repo \
              || { echo "::error::$pkg/v$ver has no release; refusing to publish a database missing it"; exit 1; }
          done
          cd repo
          for f in *.pkg.tar.zst; do
            gpg --batch --yes --detach-sign "$f"
          done
          repo-add --sign arch-pkgbuilds.db.tar.gz ./*.pkg.tar.zst
          # repo-add leaves .db/.files (and their .sig) as symlinks to the .tar.gz
          # files; releases can't hold symlinks, so replace each with a real copy.
          for link in arch-pkgbuilds.db arch-pkgbuilds.db.sig arch-pkgbuilds.files arch-pkgbuilds.files.sig; do
            cp --remove-destination "$(readlink -f "$link")" "$link"
          done

      - name: Publish to rolling release
        timeout-minutes: 45
        run: |
          gh release view repo >/dev/null 2>&1 \
            || gh release create repo --latest=false \
                 --title "Pacman repository" \
                 --notes "Rolling release backing the pacman repository — see the README."
          published="$(gh release view repo --json assets --jq '.assets[] | "\(.name) \(.size)"')"
          # A package filename is immutable, so re-uploading every package on every
          # sync is hundreds of megabytes of pointless traffic through the endpoint
          # that stalls. Send only what the release does not already hold.
          stale=()
          for f in repo/*.pkg.tar.zst; do
            grep -qxF "$(basename "$f") $(stat -c%s "$f")" <<<"$published" || stale+=("$f")
          done
          bash scripts/gh-upload.sh repo "${stale[@]}"                        # packages first...
          bash scripts/gh-upload.sh repo repo/*.pkg.tar.zst.sig repo/arch-pkgbuilds.*   # ...then the database listing them
          for name in $(gh release view repo --json assets --jq '.assets[].name'); do
            [ -e "repo/$name" ] || gh release delete-asset repo "$name" -y   # drop assets this sync no longer carries
          done
