name: Release

on:
  push:
    tags:
      - '*/v*'                     # e.g. google-chrome/v151.0.7922.169
    branches:
      - main
    paths:
      - 'packages/*/PKGBUILD'      # e.g. a merged autoupdate PR
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (leave blank to release all)
        type: string
        required: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.l.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: l
        env:
          pkg_input: ${{ github.event.inputs.package }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            list="[\"${GITHUB_REF_NAME%%/*}\"]"
          elif [ "${{ github.event_name }}" = "push" ]; then
            list="$(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' -- 'packages/*/PKGBUILD' | cut -d/ -f2 | sort -u | jq -Rsc 'split("\n")|map(select(length>0))')"
          elif [ -n "$pkg_input" ]; then
            list="$(jq -nc --arg p "$pkg_input" '[$p]')"
          else
            list="$(bash scripts/list-packages.sh)"
          fi
          echo "packages=$list" >> "$GITHUB_OUTPUT"

  release:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      GH_TOKEN: ${{ github.token }}
      pkg: ${{ matrix.package }}
    steps:
      - name: Install git                # checkout and the setup action need it
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-arch

      - name: Resolve tag
        id: r
        run: |
          test -f "packages/$pkg/PKGBUILD" || { echo "Unknown package: $pkg" >&2; exit 1; }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$pkg/v$(grep -oP '^pkgver=\K.*' "packages/$pkg/PKGBUILD")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=${tag##*/v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: sudo -H -u builder bash -c "cd 'packages/$pkg' && bash '$GITHUB_WORKSPACE/scripts/build.sh'"

      - name: Publish release
        env:
          tag: ${{ steps.r.outputs.tag }}
          ver: ${{ steps.r.outputs.ver }}
        run: |
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes "$pkg $ver"
            gh release upload "$tag" packages/$pkg/*.pkg.tar.zst --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "$tag" --notes "$pkg $ver" \
              packages/$pkg/*.pkg.tar.zst
          fi

  # Regenerate the pacman repository: the rolling release "repo" carries every
  # package at its current pkgver plus the repo-add database, so users can point
  # pacman.conf at it (see README). Full sync each time — idempotent, self-healing.
  repo:
    needs: release
    if: ${{ !cancelled() }}     # sync what did release even if one package failed
    runs-on: ubuntu-latest
    container: archlinux:latest
    concurrency:
      group: pacman-repo
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli

      - uses: actions/checkout@v4

      - name: Build repo database
        env:
          signing_key: ${{ secrets.SIGNING_KEY }}
        run: |
          gpg --batch --import <<<"$signing_key"
          mkdir repo
          for path in packages/*/; do
            pkg="$(basename "$path")"
            ver="$(grep -oP '^pkgver=\K.*' "$path/PKGBUILD")"
            gh release download "$pkg/v$ver" --pattern '*.pkg.tar.zst' --dir repo \
              || echo "::warning::$pkg/v$ver has no release; leaving it out of the repo db"
          done
          cd repo
          for f in *.pkg.tar.zst; do
            gpg --batch --yes --detach-sign "$f"
          done
          repo-add --sign arch-pkgbuilds.db.tar.gz ./*.pkg.tar.zst
          # repo-add leaves .db/.files (and their .sig) as symlinks to the .tar.gz
          # files; releases can't hold symlinks, so replace them with real copies
          rm -f arch-pkgbuilds.db arch-pkgbuilds.db.sig arch-pkgbuilds.files arch-pkgbuilds.files.sig
          cp arch-pkgbuilds.db.tar.gz arch-pkgbuilds.db
          cp arch-pkgbuilds.db.tar.gz.sig arch-pkgbuilds.db.sig
          cp arch-pkgbuilds.files.tar.gz arch-pkgbuilds.files
          cp arch-pkgbuilds.files.tar.gz.sig arch-pkgbuilds.files.sig

      - name: Publish to rolling release
        run: |
          assets="$(gh release view repo --json assets --jq '.assets[] | "\(.name) \(.size)"' 2>/dev/null)" \
            || gh release create repo --latest=false \
                 --title "Pacman repository" \
                 --notes "Rolling release backing the pacman repository — see the README."
          # drop assets this sync no longer carries
          for name in $(cut -d' ' -f1 <<<"$assets"); do
            [ -e "repo/$name" ] || gh release delete-asset repo "$name" -y
          done
          # packages are version-stamped: skip any already up there (name and size match)
          for f in repo/*.pkg.tar.zst*; do
            grep -qxF "$(basename "$f") $(stat -c%s "$f")" <<<"$assets" \
              || gh release upload repo "$f" --clobber
          done
          gh release upload repo repo/arch-pkgbuilds.db* repo/arch-pkgbuilds.files* --clobber
