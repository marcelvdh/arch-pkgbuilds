name: Release

on:
  push:
    tags:
      - '*/v*'                     # e.g. google-chrome/v151.0.7922.169
    branches:
      - main
    paths:
      - 'packages/*/PKGBUILD'
  workflow_dispatch:
    inputs:
      package:
        description: Package to release ("all" for every package; blank for whatever is not released yet)
        type: string
        required: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    env:
      GH_TOKEN: ${{ github.token }}
      pkg_input: ${{ github.event.inputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        env:
          before: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            list="$(git diff --name-only --diff-filter=d "$before" "$GITHUB_SHA" -- 'packages/*/PKGBUILD' \
              | cut -d/ -f2 | jq -Rnc '[inputs]')"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            list="$(jq -nc --arg p "${GITHUB_REF_NAME%%/*}" '[$p]')"
          elif [ "$pkg_input" = all ]; then
            list="$(bash scripts/list-packages.sh)"
          elif [ -n "$pkg_input" ]; then
            list="$(jq -nc --arg p "$pkg_input" '[$p]')"
          else
            list="$(bash scripts/unreleased.sh)"
          fi
          echo "packages=$list" >> "$GITHUB_OUTPUT"

  release:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    # Per package, so merges of different packages release side by side
    # instead of the newest run cancelling the ones waiting behind it.
    concurrency:
      group: release-${{ matrix.package }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60      # a stalled upload must not hold a runner for 6h
    defaults:
      run:
        shell: bash          # container steps otherwise default to `sh -e {0}`
    env:
      GH_TOKEN: ${{ github.token }}
      pkg: ${{ matrix.package }}
    steps:
      - name: Install git                # checkout and the setup action need it
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-arch

      - name: Verify upstream checksums
        working-directory: packages/${{ matrix.package }}
        run: sudo -H -u builder bash "$GITHUB_WORKSPACE/scripts/verify.sh"

      - name: Build
        working-directory: packages/${{ matrix.package }}
        run: sudo -H -u builder bash "$GITHUB_WORKSPACE/scripts/build.sh"

      - name: Publish release
        timeout-minutes: 45
        run: |
          source scripts/lib.sh
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$pkg/v$(pkgbuild pkgver "packages/$pkg/PKGBUILD")"
          fi
          notes="$pkg ${tag##*/v}"
          # Make the tag ourselves; letting `gh release create` do it can leave it untagged.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null 2>&1 || true
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$notes" 2>/dev/null \
            || gh release edit "$tag" --title "$tag" --notes "$notes"
          # Upload before pruning: deleting first leaves the release empty whenever
          # the upload stalls, and the repo job then refuses to build a database.
          bash scripts/gh-upload.sh "$tag" packages/$pkg/*.pkg.tar.zst
          for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
            [ -e "packages/$pkg/$asset" ] || gh release delete-asset "$tag" "$asset" -y
          done
