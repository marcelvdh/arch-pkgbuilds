name: Release

on:
  push:
    tags:
      - '*/v*'                     # e.g. google-chrome/v151.0.7922.169
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (leave blank to release whatever is not released yet)
        type: string
        required: false

permissions:
  contents: write

# GitHub sometimes delivers two push events for one merge. Without this, both runs
# race to create the same release, one ends up untagged, and its uploads 404.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false        # a second merge must not cancel the first one's release

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    env:
      GH_TOKEN: ${{ github.token }}
      pkg_input: ${{ github.event.inputs.package }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            list="$(jq -nc --arg p "${GITHUB_REF_NAME%%/*}" '[$p]')"   # claude-code/v2.1.252 -> claude-code
          elif [ -n "$pkg_input" ]; then
            list="$(jq -nc --arg p "$pkg_input" '[$p]')"
          else
            list="$(bash scripts/unreleased.sh)"
          fi
          echo "packages=$list" >> "$GITHUB_OUTPUT"

  release:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      GH_TOKEN: ${{ github.token }}
      pkg: ${{ matrix.package }}
    steps:
      - name: Install git                # checkout and the setup action need it
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-arch

      - name: Resolve tag
        id: tag
        run: |
          test -f "packages/$pkg/PKGBUILD" || { echo "Unknown package: $pkg" >&2; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$pkg/v$(grep -oPm1 '^pkgver=\K.*' "packages/$pkg/PKGBUILD")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=${tag##*/v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: sudo -H -u builder bash -c "cd 'packages/$pkg' && bash '$GITHUB_WORKSPACE/scripts/build.sh'"

      - name: Publish release
        env:
          tag: ${{ steps.tag.outputs.tag }}
          ver: ${{ steps.tag.outputs.ver }}
        run: |
          # Create the tag first: when `gh release create` has to create it, the
          # release can end up untagged and asset uploads to it then 404.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null 2>&1 || true
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$pkg $ver" 2>/dev/null \
            || gh release edit "$tag" --title "$tag" --notes "$pkg $ver"
          gh release upload "$tag" packages/$pkg/*.pkg.tar.zst --clobber

  # Regenerate the pacman repository: the rolling release "repo" carries every
  # package at its current pkgver plus the repo-add database, so users can point
  # pacman.conf at it (see README). Full sync each time — idempotent, self-healing.
  repo:
    needs: [discover, release]
    if: ${{ !cancelled() && needs.discover.outputs.packages != '[]' }}   # nothing released, nothing to sync
    runs-on: ubuntu-latest
    container: archlinux:latest
    concurrency:
      group: pacman-repo
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli

      - uses: actions/checkout@v4

      - name: Build repo database
        env:
          signing_key: ${{ secrets.SIGNING_KEY }}
        run: |
          gpg --batch --import <<<"$signing_key"
          mkdir repo
          for path in packages/*/; do
            pkg="$(basename "$path")"
            ver="$(grep -oPm1 '^pkgver=\K.*' "$path/PKGBUILD")"
            gh release download "$pkg/v$ver" --pattern '*.pkg.tar.zst' --dir repo \
              || { echo "::error::$pkg/v$ver has no release; refusing to publish a database missing it"; exit 1; }
          done
          cd repo
          for f in *.pkg.tar.zst; do
            gpg --batch --yes --detach-sign "$f"
          done
          repo-add --sign arch-pkgbuilds.db.tar.gz ./*.pkg.tar.zst
          # repo-add leaves .db/.files (and their .sig) as symlinks to the .tar.gz
          # files; releases can't hold symlinks, so replace each with a real copy.
          for link in arch-pkgbuilds.db arch-pkgbuilds.db.sig arch-pkgbuilds.files arch-pkgbuilds.files.sig; do
            cp --remove-destination "$(readlink -f "$link")" "$link"
          done

      - name: Publish to rolling release
        run: |
          assets="$(gh release view repo --json assets --jq '.assets[] | "\(.name) \(.size)"' 2>/dev/null)" \
            || gh release create repo --latest=false \
                 --title "Pacman repository" \
                 --notes "Rolling release backing the pacman repository — see the README."
          # drop assets this sync no longer carries
          for name in $(cut -d' ' -f1 <<<"$assets"); do
            [ -e "repo/$name" ] || gh release delete-asset repo "$name" -y
          done
          # packages are version-stamped: skip any already up there (name and size match)
          for f in repo/*.pkg.tar.zst*; do
            grep -qxF "$(basename "$f") $(stat -c%s "$f")" <<<"$assets" \
              || gh release upload repo "$f" --clobber
          done
          gh release upload repo repo/arch-pkgbuilds.db* repo/arch-pkgbuilds.files* --clobber
