name: Release

on:
  push:
    tags:
      - '*/v*'                     # e.g. google-chrome/v151.0.7922.169
    branches:
      - main
    paths:
      - 'packages/*/PKGBUILD'      # e.g. a merged autoupdate PR
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (leave blank to release all)
        type: string
        required: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.l.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: l
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            list="[\"${GITHUB_REF_NAME%%/*}\"]"
          elif [ "${{ github.event_name }}" = "push" ]; then
            list="$(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' -- 'packages/*/PKGBUILD' | cut -d/ -f2 | sort -u | jq -Rsc 'split("\n")|map(select(length>0))')"
          elif [ -n "${{ github.event.inputs.package }}" ]; then
            list="[\"${{ github.event.inputs.package }}\"]"
          else
            list="$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rsc 'split("\n")|map(select(length>0))')"
          fi
          echo "packages=$list" >> "$GITHUB_OUTPUT"

  release:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      GH_TOKEN: ${{ github.token }}
      pkg: ${{ matrix.package }}
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed base-devel pacman-contrib namcap git sudo github-cli w3m

      - uses: actions/checkout@v4

      - name: Prepare build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve tag
        id: r
        run: |
          test -f "packages/$pkg/PKGBUILD" || { echo "Unknown package: $pkg" >&2; exit 1; }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$pkg/v$(grep -oP '^pkgver=\K.*' "packages/$pkg/PKGBUILD")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build
        run: sudo -H -u builder bash -c "cd 'packages/$pkg' && bash '$GITHUB_WORKSPACE/scripts/build.sh'"

      - name: Publish release
        run: |
          tag="${{ steps.r.outputs.tag }}"
          ver="$(grep -oP '^pkgver=\K.*' "packages/$pkg/PKGBUILD")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes "$pkg $ver"
            gh release upload "$tag" packages/$pkg/*.pkg.tar.zst --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "$tag" --notes "$pkg $ver" \
              packages/$pkg/*.pkg.tar.zst
          fi
