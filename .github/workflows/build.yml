name: Build

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['packages/*/PKGBUILD']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.l.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "packages=$(bash scripts/list-packages.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - name: Install git                # checkout and the setup action need it
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-arch

      - name: Build and lint
        env:
          pkg: ${{ matrix.package }}
        run: sudo -H -u builder bash -c "cd 'packages/$pkg' && bash '$GITHUB_WORKSPACE/scripts/build.sh'"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-pkg
          path: ${{ github.workspace }}/packages/${{ matrix.package }}/*.pkg.tar.zst
          if-no-files-found: error
