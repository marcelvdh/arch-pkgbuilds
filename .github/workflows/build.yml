name: Build

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['packages/*/PKGBUILD']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.l.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: l
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD)"
            if grep -qv '^packages/' <<<"$changed"; then
              list="$(bash scripts/list-packages.sh)"   # shared infra changed: build all
            else
              list="$(cut -d/ -f2 <<<"$changed" | sort -u \
                | while read -r p; do test -d "packages/$p" && echo "$p"; done \
                | jq -Rsc 'split("\n")|map(select(length>0))')"
            fi
          else
            list="$(bash scripts/list-packages.sh)"
          fi
          echo "packages=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - name: Install git                # checkout and the setup action need it
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-arch

      - name: Build and lint
        env:
          pkg: ${{ matrix.package }}
        run: sudo -H -u builder bash -c "cd 'packages/$pkg' && bash '$GITHUB_WORKSPACE/scripts/build.sh'"

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.package }}-pkg
          path: ${{ github.workspace }}/packages/${{ matrix.package }}/*.pkg.tar.zst
          if-no-files-found: error
