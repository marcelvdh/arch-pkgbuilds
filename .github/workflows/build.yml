name: Build

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['packages/*/PKGBUILD']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.l.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "packages=$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rsc 'split("\n")|map(select(length>0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed base-devel pacman-contrib namcap git sudo w3m

      - uses: actions/checkout@v4

      - name: Prepare build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and lint
        env:
          pkg: ${{ matrix.package }}
        run: sudo -H -u builder bash -c 'cd "$1" && bash "$2"' bash "$GITHUB_WORKSPACE/packages/$pkg" "$GITHUB_WORKSPACE/scripts/build.sh"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-pkg
          path: ${{ github.workspace }}/packages/${{ matrix.package }}/*.pkg.tar.zst
          if-no-files-found: error
